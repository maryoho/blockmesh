name: Go tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Benchmark smoke
        run: |
          go test ./internal/metaservice -run '^$' -bench 'Benchmark(QueueMemoryDrain|LookupContiguous|LookupMappingVector)$' -benchtime=100ms -benchmem

  kernel-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux 5.15 build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Build DM target and global character device
        run: |
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n1)"
          test -n "$KDIR"
          make -C "$KDIR" M="$GITHUB_WORKSPACE/kernel/dm-blockmesh" modules
